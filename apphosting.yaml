# Firebase App Hosting Configuration — FillQuestBee (https://fillquestbee.com)
# https://firebase.google.com/docs/app-hosting/configure

# Environment Variables and Secret Manager bindings
env:
  # Server-only secrets stored in Google Cloud Secret Manager
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: GEMINI_MODEL
    value: "gemini-3.5-flash"
    availability:
      - RUNTIME
  - variable: INITIAL_ADMIN_EMAIL
    value: "sciencevid4u@gmail.com"
    availability:
      - BUILD
      - RUNTIME

